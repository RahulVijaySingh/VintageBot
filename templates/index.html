<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Estate Chatbot</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
      }

      .split {
        height: 50%;
        width: 100%;
      }

      .top-half {
        position: relative;
        overflow: hidden;
      }

      video {
        width: 100%;
        height: 100%;
        /* object-fit: cover; */
        object-fit: fill;
      }

      .bottom-half {
        background-color: #1e1e1e;
        color: white;
        display: flex;
        flex-direction: column;
        padding: 10px;
        overflow: hidden;
      }

      #chatbox {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        border: 1px solid #333;
        margin-bottom: 10px;
      }

      .message {
        margin: 6px 0;
        font-size: 16px;
      }

      .bot {
        color: #00bfff;
      }

      .user {
        color: #00ff99;
        /* text-align: right; */
        text-align: justify;
      }

      #chat-input {
        display: flex;
      }

      #input {
        flex: 1;
        padding: 8px;
        font-size: 16px;
        border-radius: 4px;
        border: none;
      }

      button {
        margin-left: 10px;
        padding: 8px 16px;
        font-size: 16px;
        background-color: #0077cc;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background-color: #005fa3;
      }
    </style>
  </head>
  <body>
    <!-- Top Half - Video -->
    <div class="split top-half">
      <video autoplay muted loop>
        <source src="../static/final.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>

    <!-- Bottom Half - Chatbot -->
    <div class="split bottom-half">
      <div id="chatbox">
        <div id="messages"></div>
      </div>
      <div id="chat-input">
        <input type="text" id="input" placeholder="Type a message..." />
        <button onclick="handleSend()">Send</button>
      </div>
    </div>

    <script>
      let session = {};

      async function sendMessage(message = "") {
        if (!message && Object.keys(session).length > 0) return;
        if (message) appendMessage("user", message);

        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, session }),
        });

        const data = await res.json();
        session = data.session;
        appendMessage("bot", data.response);
      }

      function appendMessage(role, text) {
        const div = document.createElement("div");
        div.className = "message " + role;
        div.innerHTML = (role === "bot" ? "🤖" : "🧑") + " " + text;
        document.getElementById("messages").appendChild(div);
        document.getElementById("chatbox").scrollTop =
          document.getElementById("chatbox").scrollHeight;
      }

      function handleSend() {
        const input = document.getElementById("input");
        const msg = input.value.trim();
        if (!msg) return;
        input.value = "";
        sendMessage(msg);
      }

      document
        .getElementById("input")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") handleSend();
        });

      window.onload = () => sendMessage();
    </script>
  </body>
</html>
